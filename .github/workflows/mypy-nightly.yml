name: Nightly (mypy)

# Nightly full-tree type check.  Not a PR gate — regressions found
# here are fixed when convenient, not blocking merges.  The pyproject
# [tool.mypy] section owns the config (ignore_missing_imports
# overrides, excludes).
#
# Runs against the full venv so type-checking can resolve imports from
# installed dependencies.

on:
  schedule:
    # 08:00 UTC — an hour after the nightly slow+integration run.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  VENV_PATH: .venv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore or rebuild venv
        uses: ./.github/actions/setup-venv

      - name: Run mypy
        run: |
          source $VENV_PATH/bin/activate
          mypy --config-file pyproject.toml core/ packages/
